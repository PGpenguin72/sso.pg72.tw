name: Isolated Preview DAST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-dast:
    if: ${{ github.actor == 'PGpenguin72' && github.triggering_actor == 'PGpenguin72' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: isolated-preview
    env:
      DAST_TARGET: ${{ vars.PGID_DAST_PREVIEW_ORIGIN }}
      DAST_ALLOWED_PREVIEW_ORIGIN: ${{ vars.PGID_DAST_PREVIEW_ORIGIN }}
      DAST_PREVIEW_OPT_IN: ${{ vars.PGID_DAST_PREVIEW_OPT_IN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify release identities before setup
        run: node scripts/security/release-identity.mjs

      - name: Authorize repository Preview policy
        run: node scripts/security/dast.mjs --authorize-only --preview

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run credential-free Preview probes
        run: pnpm dast:preview
